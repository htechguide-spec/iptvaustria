  <text x="600" y="78" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">Wähle deine gewünschte Laufzeit</text>

  <!-- 4 Cards -->
  <!-- Card 1: 1 Monat -->
  <g transform="translate(35, 105)">
    <rect width="265" height="475" rx="16" fill="#101420" stroke="#262d40" stroke-width="1"/>
