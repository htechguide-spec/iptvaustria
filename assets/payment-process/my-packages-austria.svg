    <rect x="20" y="410" width="225" height="44" rx="10" fill="#222a3d" stroke="#334155" stroke-width="1"/>
    <text x="132" y="437" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">JETZT BEZAHLEN</text>
