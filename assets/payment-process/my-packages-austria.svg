    <text x="212" y="47" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">50% Sparen</text>

    <text x="20" y="94" fill="#ffffff" font-size="34" font-weight="800">59.95 €</text>
    <text x="20" y="116" fill="#94a3b8" font-size="11" font-family="monospace">4,99 €/Monat</text>
    <line x1="20" y1="132" x2="255" y2="132" stroke="#3b4256" stroke-width="1"/>

    <g transform="translate(20, 155)" font-size="11" fill="#ffffff">
      <text y="0"><tspan fill="#34d399" font-weight="bold">✓ </tspan><tspan font-weight="bold">Bestpreis: nur 4,99 €/Monat</tspan></text>
      <text y="30"><tspan fill="#34d399" font-weight="bold">✓ </tspan>ADMIRAL Bundesliga komplett</text>
      <text y="60"><tspan fill="#34d399" font-weight="bold">✓ </tspan>Ski Alpin Weltcup &amp; Formel 1</text>
      <text y="90"><tspan fill="#34d399" font-weight="bold">✓ </tspan>VIP VIX Node (99.9% Uptime)</text>
      <text y="120"><tspan fill="#34d399" font-weight="bold">✓ </tspan>App-Aktivierungshilfe gratis</text>
      <text y="150"><tspan fill="#34d399" font-weight="bold">✓ </tspan>Einmalzahlung · Kein Abo</text>
    </g>

    <rect x="20" y="422" width="235" height="48" rx="12" fill="url(#redGrad)"/>
    <text x="137" y="452" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="1">JETZT BEZAHLEN</text>
  </g>
</svg>