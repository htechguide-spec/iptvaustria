      <text y="90"><tspan fill="#34d399" font-weight="bold">✓ </tspan>Auf allen Geräten nutzbar</text>
      <text y="120"><tspan fill="#34d399" font-weight="bold">✓ </tspan>24/7 WhatsApp Support</text>
      <text y="150"><tspan fill="#34d399" font-weight="bold">✓ </tspan>Keine automatische Verlängerung</text>
    </g>

    <rect x="20" y="410" width="225" height="44" rx="10" fill="#222a3d" stroke="#334155" stroke-width="1"/>
    <text x="132" y="437" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">JETZT BEZAHLEN</text>
  </g>

  <!-- Card 3: 6 Monate -->
