    <rect width="265" height="475" rx="16" fill="#101420" stroke="#262d40" stroke-width="1"/>
    <text x="20" y="40" fill="#ffffff" font-size="18" font-weight="bold">6 Monate</text>
    <rect x="165" y="23" width="80" height="20" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <text x="205" y="37" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">25% Sparen</text>

    <text x="20" y="80" fill="#ffffff" font-size="32" font-weight="800">45 €</text>
    <text x="20" y="102" fill="#94a3b8" font-size="11" font-family="monospace">7,50 €/Monat</text>
    <line x1="20" y1="120" x2="245" y2="120" stroke="#262d40" stroke-width="1"/>

