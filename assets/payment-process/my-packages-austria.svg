    <text x="20" y="80" fill="#ffffff" font-size="32" font-weight="800">10 €</text>
    <text x="20" y="102" fill="#94a3b8" font-size="11" font-family="monospace">10,00 €/Monat</text>
    <line x1="20" y1="120" x2="245" y2="120" stroke="#262d40" stroke-width="1"/>

    <g transform="translate(20, 145)" font-size="11" fill="#cbd5e1">
      <text y="0"><tspan fill="#34d399" font-weight="bold">✓ </tspan>21.000+ Live-Sender in 4K</text>
      <text y="30"><tspan fill="#34d399" font-weight="bold">✓ </tspan>120.000+ Filme &amp; Serien</text>
      <text y="60"><tspan fill="#34d399" font-weight="bold">✓ </tspan>ORF 1 UHD &amp; Sky Sport</text>
      <text y="90"><tspan fill="#34d399" font-weight="bold">✓ </tspan>Anti-Freeze™ 8.0</text>
